<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NammaRescue – Community Disaster Management Platform</title>
<meta name="description" content="Community-led disaster response, emergency assistance, volunteer dispatch, shelter discovery, and offline incident reporting in English and Tamil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2545;--navy-2:#13315C;--teal:#12A5A0;--teal-ink:#0A6F6C;
  --bg:#F1F4F8;--surface:#FFFFFF;--surface-2:#F6F8FB;--text:#0F1F36;--muted:#586A82;--line:#DAE2EC;
  --btn:#0A6F6C;--btn-h:#08595A;--btn-t:#FFFFFF;--head-bg:#0B2545;
  --danger:#B8243A;--danger-bg:#FCE9EC;--warn:#8F5600;--warn-bg:#FFF1D9;--ok:#14733A;--ok-bg:#E3F5EA;--info:#1A5FA6;--info-bg:#E4F0FB;
  --shadow:0 1px 2px rgba(11,37,69,.06),0 10px 26px -10px rgba(11,37,69,.16);
  --r:16px;--r-s:10px;color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08111F;--surface:#0F203A;--surface-2:#132846;--text:#E7EEF7;--muted:#9DB0C8;--line:#233B5E;
    --btn:#2BC4BE;--btn-h:#4AD6D0;--btn-t:#06223A;--teal-ink:#4FD8D2;--head-bg:#061326;
    --danger:#FF8A96;--danger-bg:#3A1823;--warn:#F5B94D;--warn-bg:#382A0E;--ok:#6FD79A;--ok-bg:#12301F;--info:#7FB8F0;--info-bg:#132F4D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08111F;--surface:#0F203A;--surface-2:#132846;--text:#E7EEF7;--muted:#9DB0C8;--line:#233B5E;
  --btn:#2BC4BE;--btn-h:#4AD6D0;--btn-t:#06223A;--teal-ink:#4FD8D2;--head-bg:#061326;
  --danger:#FF8A96;--danger-bg:#3A1823;--warn:#F5B94D;--warn-bg:#382A0E;--ok:#6FD79A;--ok-bg:#12301F;--info:#7FB8F0;--info-bg:#132F4D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.5);color-scheme:dark;
}
html{scroll-padding-top:76px;scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Figtree','Noto Sans Tamil',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
:lang(ta) body,html:lang(ta) body{line-height:1.7}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Noto Sans Tamil',system-ui,sans-serif;line-height:1.15;letter-spacing:-.015em;margin:0 0 .5em;font-weight:700}
html:lang(ta) h1,html:lang(ta) h2,html:lang(ta) h3,html:lang(ta) h4{line-height:1.35;letter-spacing:0}
h1{font-size:clamp(2rem,4.5vw,3.2rem)}h2{font-size:clamp(1.4rem,2.8vw,1.9rem)}h3{font-size:1.15rem}
p{margin:0 0 .8em}a{color:var(--teal-ink);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.container{width:min(1180px,100% - 2rem);margin-inline:auto}
.muted{color:var(--muted)}.small{font-size:.875rem}.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}.between{justify-content:space-between}
.stack>*+*{margin-top:1rem}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:#fff;color:#0B2545;padding:.6rem 1rem;z-index:100;border-radius:0 0 8px 0;font-weight:700}
.skip:focus{left:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top simulation notice banner */
.demo-banner{background:var(--warn-bg);color:var(--warn);border-bottom:1px solid rgba(143,86,0,.2);font-size:.82rem;font-weight:600;padding:.4rem 0}
.demo-banner .container{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}

/* header */
.hdr{position:sticky;top:0;z-index:40;background:var(--head-bg);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.hdr-in{display:flex;align-items:center;gap:.8rem;min-height:64px}
.brand{display:flex;align-items:center;gap:.65rem;color:#fff;text-decoration:none;margin-right:auto}
.brand:hover{text-decoration:none}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--teal);display:grid;place-items:center;color:#06223A}
.brand-mark .ic{width:22px;height:22px}
.brand b{font-family:'Bricolage Grotesque',sans-serif;font-size:1.2rem;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{display:block;font-size:.72rem;color:#A9BBD4;line-height:1.2}
.nav{display:flex;align-items:center;gap:.25rem}
.nav a.nl{color:#D5E0F0;text-decoration:none;padding:.5rem .8rem;border-radius:999px;font-weight:500;font-size:.95rem;transition:background .15s}
.nav a.nl:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.nl[aria-current="page"]{background:rgba(43,196,190,.18);color:#fff;font-weight:700}
.hdr-tools{display:flex;align-items:center;gap:.5rem}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.seg button{background:none;border:0;color:#D5E0F0;padding:.3rem .75rem;border-radius:999px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:#fff;color:#0B2545}
.menu-btn{display:none;background:rgba(255,255,255,.1);border:0;color:#fff;width:42px;height:42px;border-radius:12px;cursor:pointer}
.pill-off{display:inline-flex;align-items:center;gap:.35rem;background:var(--warn-bg);color:var(--warn);padding:.25rem .65rem;border-radius:999px;font-size:.8rem;font-weight:600;text-decoration:none;border:1px solid rgba(143,86,0,.3)}
.pill-off:hover{background:var(--warn);color:#fff;text-decoration:none}
.bell-wrap{position:relative}
.icon-btn{position:relative;background:rgba(255,255,255,.1);border:0;color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.icon-btn .cnt{position:absolute;top:-4px;right:-4px;background:#FF5D6C;color:#fff;border-radius:999px;font-size:.68rem;min-width:18px;height:18px;display:grid;place-items:center;font-weight:700;padding:0 4px}
.drop{position:absolute;right:0;top:48px;width:min(340px,88vw);background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:.75rem;z-index:60}
.drop ul{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.drop li{padding:.55rem .4rem;border-bottom:1px solid var(--line);font-size:.9rem}
.drop li:last-child{border:0}.drop li.unread{font-weight:600;background:var(--surface-2)}
.drop li small{display:block;color:var(--muted);font-weight:400}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1.5px solid transparent;background:var(--btn);color:var(--btn-t);padding:.6rem 1.1rem;border-radius:12px;font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;transition:background .15s,transform .1s;min-height:42px}
.btn:hover{background:var(--btn-h);text-decoration:none}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.light{background:#fff;color:#0B2545}.btn.light:hover{background:#E6EEF8}
.btn.outline-w{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}.btn.outline-w:hover{background:rgba(255,255,255,.1)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}.btn.danger:hover{background:var(--danger-bg)}
.btn.sm{padding:.35rem .75rem;font-size:.85rem;border-radius:10px;min-height:34px}
.btn[disabled]{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn.block{width:100%}

/* hero */
.hero{background:radial-gradient(900px 500px at 85% -10%,#1B4A7A 0,transparent 60%),var(--navy);color:#fff;position:relative;overflow:hidden}
.ripples{position:absolute;right:-120px;top:-60px;width:620px;height:620px;opacity:.9;pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:2.5rem;padding:3rem 0 3.5rem;align-items:center}
.hero h1{color:#fff;max-width:16ch}
html:lang(ta) .hero h1{max-width:18ch}
.hero p.lead{font-size:1.12rem;color:#C9D8EC;max-width:52ch}
.hero .actions{display:flex;flex-wrap:wrap;gap:.7rem;margin:1.4rem 0 1rem}
.helpline{display:inline-flex;align-items:center;gap:.5rem;color:#C9D8EC;font-size:.95rem}
.helpline strong{color:#fff;font-size:1.05rem}
.board{background:var(--surface);color:var(--text);border-radius:20px;padding:1.2rem;box-shadow:0 30px 60px -25px rgba(0,0,0,.6)}
.board h2{font-size:1.05rem;display:flex;align-items:center;gap:.5rem;margin:0 0 .9rem}
.live{width:10px;height:10px;border-radius:50%;background:#E5384D;position:relative}
.live::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #E5384D;opacity:.6;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.7}to{transform:scale(1.6);opacity:0}}
.board h3{font-size:.85rem;color:var(--muted);font-family:inherit;font-weight:600;letter-spacing:0;margin:1rem 0 .4rem}
.mini-alert{display:flex;gap:.6rem;background:var(--danger-bg);color:var(--danger);padding:.7rem;border-radius:12px;font-size:.92rem;font-weight:600}
.mini-shel{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;font-size:.9rem;margin-bottom:.55rem}
.mini-shel .meter{grid-column:1/-1}
.mini-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;text-align:center}
.mini-counts div{background:var(--surface-2);border-radius:10px;padding:.5rem .2rem}
.mini-counts b{display:block;font-size:1.25rem;font-family:'Bricolage Grotesque',sans-serif}
.mini-counts span{font-size:.7rem;color:var(--muted);line-height:1.2;display:block}

/* alert banner */
.banner{background:var(--danger-bg);color:var(--danger);border-bottom:1px solid color-mix(in srgb,var(--danger) 25%,transparent)}
.banner-in{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;flex-wrap:wrap}
.banner strong{color:var(--danger)}
.banner span.txt{color:var(--text);flex:1;min-width:220px}
.banner a{font-weight:600;color:var(--danger);text-decoration:underline}

/* sections */
.section{padding:3.2rem 0}
.section.alt{background:var(--surface)}
.section-head{max-width:60ch;margin-bottom:1.8rem}
.section-head p{color:var(--muted)}
.grid{display:grid;gap:1.1rem}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem;box-shadow:var(--shadow)}
.section.alt .card{background:var(--surface-2);box-shadow:none}
.feat .fi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal-ink);margin-bottom:.8rem}
.feat .fi .ic{width:22px;height:22px}
.feat p{color:var(--muted);margin:0}
.meter{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .5s}
.meter span.hot,.meter.low span{background:#E0762B}
.res{padding:.9rem 0;border-bottom:1px solid var(--line)}
.res:last-child{border:0}
.res-h{display:flex;align-items:center;gap:.8rem;margin-bottom:.5rem}
.res-h>.ic{width:26px;height:26px;color:var(--teal-ink)}
.res-h>div:nth-child(2){flex:1;display:flex;flex-direction:column;line-height:1.3}
.res-n{text-align:right;font-size:.9rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding-top:2.9rem}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;top:0;left:0;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
html[data-theme="dark"] .steps li::before{background:var(--teal);color:#06223A}
.steps li::after{content:"";position:absolute;top:1.05rem;left:2.6rem;right:-.6rem;height:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps h3{margin-bottom:.2rem}.steps p{color:var(--muted);margin:0}
.cta{background:var(--navy);color:#fff;border-radius:24px;padding:2.2rem;display:flex;justify-content:space-between;align-items:center;gap:1.5rem;flex-wrap:wrap}
.cta h2{color:#fff;margin:0 0 .3rem}.cta p{margin:0;color:#C9D8EC}
.ftr{background:var(--head-bg);color:#B7C8E0;padding:2.5rem 0 1.5rem;margin-top:2rem}
.ftr a{color:#E2ECF8}.ftr h4{color:#fff;font-size:1rem}
.ftr-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:2rem}
.ftr ul{list-style:none;padding:0;margin:0}.ftr li{margin:.3rem 0}
.ftr .fine{border-top:1px solid rgba(255,255,255,.1);margin-top:1.8rem;padding-top:1rem;font-size:.85rem}

/* badges */
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .6rem;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.st-Pending{background:var(--warn-bg);color:var(--warn)}
.st-Acknowledged{background:var(--info-bg);color:var(--info)}
.st-InProgress{background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal-ink)}
.st-Resolved{background:var(--ok-bg);color:var(--ok)}
.st-Cancelled,.rs-rejected,.sh-closed{background:var(--line);color:var(--muted)}
.sev-low,.rs-verified,.sh-open,.lv-info{background:var(--ok-bg);color:var(--ok)}
.sev-medium,.rs-pending,.lv-watch{background:var(--warn-bg);color:var(--warn)}
.sev-high,.sh-full{background:#FFE6D3;color:#9A4300}
html[data-theme="dark"] .sev-high,html[data-theme="dark"] .sh-full{background:#3A210E;color:#FFB27A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sev-high,:root:not([data-theme="light"]) .sh-full{background:#3A210E;color:#FFB27A}}
.sev-critical,.lv-severe,.lv-warning{background:var(--danger-bg);color:var(--danger)}
.badge-sample{background:rgba(143,86,0,.15);color:var(--warn);border:1px dashed var(--warn);font-size:.72rem}

/* forms */
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.field>label,.fl{font-weight:600;font-size:.9rem}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.6rem .75rem;width:100%;min-height:44px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--teal) 45%,transparent);border-color:var(--teal-ink)}
input[type=range]{padding:0;min-height:32px;accent-color:var(--teal)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--teal-ink)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 1rem}
.form-grid .full{grid-column:1/-1}
.input-with-btn{display:flex;gap:.5rem;align-items:stretch}
.input-with-btn input{flex:1}
.checks{display:flex;flex-wrap:wrap;gap:.5rem}
.checks label{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .8rem;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;font-size:.9rem;font-weight:500}
.checks label:has(input:checked){background:color-mix(in srgb,var(--teal) 16%,transparent);border-color:var(--teal-ink)}
.hint{font-size:.82rem;color:var(--muted)}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em;margin:.2rem 0 .6rem;font-weight:600}
.photo-prev-wrap{margin-top:.5rem;display:none;position:relative;max-width:260px}
.photo-prev{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.photo-remove{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:999px;padding:.2rem .6rem;font-size:.78rem;cursor:pointer}
.auth{max-width:460px;margin:2rem auto}
.demo{margin-top:1.2rem;padding-top:1rem;border-top:1px dashed var(--line)}
.demo .row{justify-content:space-between;margin:.35rem 0;font-size:.9rem}

/* dashboard */
.dash{display:grid;grid-template-columns:250px 1fr;gap:1.5rem;padding:1.6rem 0 3rem;align-items:start}
.side{position:sticky;top:80px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.8rem;box-shadow:var(--shadow)}
.me{display:flex;align-items:center;gap:.7rem;padding:.4rem .4rem .8rem;border-bottom:1px solid var(--line);margin-bottom:.5rem}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.me b{display:block;line-height:1.2}.me small{color:var(--muted)}
.tabs{display:flex;flex-direction:column;gap:2px}
.tabs a{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;border-radius:10px;color:var(--text);text-decoration:none;font-weight:500;font-size:.95rem}
.tabs a:hover{background:var(--surface-2);text-decoration:none}
.tabs a[aria-current="page"]{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal-ink);font-weight:700}
.tabs .tc{margin-left:auto;background:var(--danger-bg);color:var(--danger);font-size:.72rem;border-radius:99px;padding:0 .45rem;font-weight:700}
.page-head{margin-bottom:1.2rem}.page-head p{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.9rem;margin-bottom:1.2rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow)}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:1.9rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.88rem}
.list>*+*{margin-top:.9rem}
.item h3{margin:0}
.item-top{display:flex;justify-content:space-between;gap:.8rem;align-items:flex-start;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;gap:.4rem 1rem;color:var(--muted);font-size:.88rem;margin:.4rem 0}
.meta span{display:inline-flex;align-items:center;gap:.3rem}
.actions-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.stepper{display:flex;list-style:none;margin:.9rem 0 .4rem;padding:0;gap:.3rem}
.stepper li{flex:1;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:.3rem;align-items:flex-start;position:relative}
.stepper .dot{width:100%;height:6px;border-radius:99px;background:var(--line)}
.stepper li.done .dot{background:var(--teal)}.stepper li.now .dot{background:var(--teal-ink)}
.stepper li.now{color:var(--text);font-weight:700}
.updates{margin:.8rem 0 0;padding:0;list-style:none;border-top:1px solid var(--line);font-size:.88rem}
.updates li{padding:.4rem 0;border-bottom:1px dashed var(--line);display:flex;gap:.6rem;justify-content:space-between}
.updates time{color:var(--muted);white-space:nowrap}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;align-items:end;margin-bottom:1rem}
.filters .field{margin:0}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r)}
.empty .ic{width:32px;height:32px;margin-bottom:.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;background:var(--surface-2);border:1px solid var(--line);padding:.1rem .55rem;border-radius:99px}
.chart-row{display:grid;grid-template-columns:120px 1fr 36px;gap:.6rem;align-items:center;margin:.45rem 0;font-size:.9rem}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.6rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.82rem}
.inline-form{display:flex;gap:.5rem;align-items:flex-end;flex-wrap:wrap;margin-top:.6rem}
.inline-form .field{margin:0;min-width:110px;flex:1}
.thumb{width:100%;max-width:260px;border-radius:12px;margin-top:.5rem;border:1px solid var(--line)}
.tgl{display:flex;align-items:center;gap:.6rem;font-weight:600}
.switch{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;min-height:0;border:0;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch:checked{background:var(--btn)}.switch:checked::after{left:21px}

/* toasts + dialog */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:90;width:min(460px,94vw)}
.toast{background:var(--navy);color:#fff;border-radius:12px;padding:.75rem 1rem;box-shadow:0 12px 30px -8px rgba(0,0,0,.5);display:flex;gap:.6rem;align-items:center;animation:tin .25s ease-out}
.toast.warn{background:#8F5600}.toast.err{background:#B8243A}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
dialog{border:0;border-radius:20px;padding:0;width:min(520px,94vw);background:var(--surface);color:var(--text);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(6,19,38,.6)}
.dlg{padding:1.4rem;max-height:86vh;overflow:auto}
.dlg h2{font-size:1.3rem}

/* responsive */
@media (max-width:980px){
  .hero-in{grid-template-columns:1fr;padding:2.5rem 0 3rem}
  .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:repeat(2,1fr)}.steps li::after{display:none}
  .ripples{opacity:.5}
}
@media (max-width:860px){
  .menu-btn{display:grid;place-items:center}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--head-bg);flex-direction:column;align-items:stretch;padding:.6rem 1rem 1rem;border-bottom:1px solid rgba(255,255,255,.1)}
  .nav.open{display:flex}
  .nav a.nl{padding:.8rem}
  .dash{grid-template-columns:1fr;gap:1rem}
  .side{position:sticky;top:64px;z-index:20;padding:.4rem;border-radius:14px}
  .me{display:none}
  .tabs{flex-direction:row;overflow-x:auto;scrollbar-width:thin}
  .tabs a{white-space:nowrap;flex:none}
  .ftr-grid{grid-template-columns:1fr}
}
@media (max-width:620px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .brand small{display:none}
  .hdr-tools .btn.sm.hide-s{display:none}
  .steps{grid-template-columns:1fr}
  .chart-row{grid-template-columns:90px 1fr 30px}
  .section{padding:2.2rem 0}
  .input-with-btn{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function save(){

    warnedStorage=true;

/* ---------- session management ---------- */
function me(){var id=ls.get('nammarescue_session');return db.users.filter(function(u){return u.id===id;})[0]||null;}
function isOffline(){return ui.sim||navigator.onLine===false;}

/* ---------- toasts and modal dialog ---------- */
function toast(msg,type){
  var el=document.createElement('div');el.className='toast '+(type||'');
  el.innerHTML=ic(type==='warn'||type==='err'?'alert':'check')+'<span>'+esc(msg)+'</span>';
  $('#toasts').appendChild(el);
  setTimeout(function(){if(el.parentNode)el.remove();},4500);
}
function openDlg(html){
  $('#dlg-body').innerHTML=html;
  var d=$('#dlg');
  if(!d.open){if(d.showModal)d.showModal();else d.setAttribute('open','');}
}
function closeDlg(){
  var d=$('#dlg');
  if(d.open){if(d.close)d.close();else d.removeAttribute('open');}
}

/* ---------- notifications ---------- */
function notify(userId,key,vars){
  if(!userId)return;
  db.notifications.unshift({id:uid('n_'),userId:userId,key:key,vars:vars||{},createdAt:iso(),read:false});
}
function notifText(n){
  var v={};
  for(var k in n.vars){v[k]=n.vars[k];}
  if(v.cat)v.cat=t('cat.'+v.cat);
  if(v.status)v.status=t('st.'+sk(v.status));
  return t(n.key,v);
}

/* ---------- domain logic ---------- */
function activeAlerts(){return db.alerts.slice().sort(function(a,b){return new Date(b.issuedAt)-new Date(a.issuedAt);});}
function addReport(p,u,at){
  db.reports.unshift({
    id:uid('p_'),
    userId:u.id,
    userName:u.name,
    type:p.type,
    location:p.location,
    description:p.description,
    date:p.date,
    severity:p.severity,
    photo:p.photo||null,
    status:'pending',
    createdAt:at||iso()
  });
  save();
}
function addRequest(p,u,at){
  var now=at||iso();
  db.requests.unshift({
    id:uid('q_'),
    userId:u.id,
    userName:u.name,
    category:p.category,
    people:p.people,
    location:p.location,
    urgency:p.urgency,
    disasterType:p.disasterType,
    description:p.description,
    status:'Pending',
    assignedTo:null,
    assignedName:null,
    progress:0,
    updates:[{at:now,type:'created'}],
    createdAt:now,
    updatedAt:now
  });
  save();
}
function queueOffline(kind,p,u){
  db.offline.unshift({id:uid('o_'),kind:kind,userId:u.id,userName:u.name,payload:p,createdAt:iso(),status:'queued',syncedAt:null});
  save();
}
function syncOffline(auto){
  var u=me();if(!u)return;
  var items=db.offline.filter(function(o){return o.userId===u.id&&o.status==='queued';});
  if(!items.length){if(!auto)toast(t('toast.nothingSync'),'warn');return;}
  if(isOffline()){toast(t('offlineBanner'),'warn');return;}
  items.slice().reverse().forEach(function(o){
    if(o.kind==='report')addReport(o.payload,{id:o.userId,name:o.userName},o.createdAt);
    else addRequest(o.payload,{id:o.userId,name:o.userName},o.createdAt);
    o.status='synced';
    o.syncedAt=iso();
  });
  save();
  toast(t('toast.synced',{n:items.length}));
  render();
}
function logUpdate(q,e){e.at=iso();q.updates.push(e);q.updatedAt=e.at;}
function setStatus(q,status,byName){
  q.status=status;
  if(status==='Resolved')q.progress=100;
  logUpdate(q,{type:'status',status:status,by:byName});
  notify(q.userId,'n.status',{cat:q.category,status:status});
}
function reqById(id){return db.requests.filter(function(x){return x.id===id;})[0];}

/* ---------- geolocation helper (Graceful permission handling) ---------- */
function acquireGPS(targetInputId, btnEl){
  if(!navigator.geolocation){
    toast(t('gpsNotSupp'),'warn');
    return;
  }
  var origText=btnEl.innerHTML;
  btnEl.disabled=true;
  btnEl.innerHTML=ic('compass')+' '+esc(t('detectingGPS'));

  navigator.geolocation.getCurrentPosition(
    function(pos){
      btnEl.disabled=false;
      btnEl.innerHTML=origText;
      var lat=pos.coords.latitude.toFixed(4);
      var lng=pos.coords.longitude.toFixed(4);
      var acc=Math.round(pos.coords.accuracy);
      var input=$('#'+targetInputId);
      if(input){
        var prefix=input.value.trim()?input.value.trim()+' | ':'';
        input.value=prefix+'GPS: '+lat+', '+lng+' (±'+acc+'m)';
      }
      toast(t('gpsSuccess')+' ('+lat+', '+lng+')');
    },
    function(err){
      btnEl.disabled=false;
      btnEl.innerHTML=origText;
      var msg=t('gpsDenied');
      if(err.code===1)msg=t('gpsDenied');
      toast(msg,'warn');
    },
    {enableHighAccuracy:true,timeout:9000,maximumAge:30000}
  );
}

/* ---------- UI component builders ---------- */
function badge(c,txt){return '<span class="badge '+c+'">'+txt+'</span>';}
function stBadge(s){return badge('st-'+sk(s),esc(t('st.'+sk(s))));}
function sevBadge(s){return badge('sev-'+s,esc(t('sev.'+s)));}
function sampleBadge(){return badge('badge-sample','⚠️ '+esc(t('sampleBadge')));}
function stepper(s){
  if(s==='Cancelled')return '';
  var i=STATUS.indexOf(s);
  return '<ol class="stepper" aria-label="'+esc(t('status'))+'">'+STATUS.map(function(x,k){
    return '<li class="'+(k<i?'done':k===i?'now':'')+'"'+(k===i?' aria-current="step"':'')+'><span class="dot"></span><span>'+esc(t('st.'+sk(x)))+'</span></li>';
  }).join('')+'</ol>';
}
function updatesHtml(q){
  if(!q.updates||!q.updates.length)return '';
  var rows=q.updates.slice().reverse().map(function(u){
    var txt=u.type==='created'?t('upd.created'):u.type==='status'?t('upd.status',{status:t('st.'+sk(u.status))}):u.type==='assign'?t('upd.assigned',{name:u.name}):(esc(u.note||'')||t('upd.progress',{pct:u.pct}));
    if(u.type==='note'&&u.note)txt=esc(u.note)+' ('+t('upd.progress',{pct:u.pct})+')';
    return '<li><span>'+(u.type==='created'||u.type==='status'||u.type==='assign'?esc(txt):txt)+'</span><time>'+esc(fmtDate(u.at,true))+'</time></li>';
  }).join('');
  return '<ul class="updates" aria-label="'+esc(t('updates'))+'">'+rows+'</ul>';
}

/* ---------- volunteer views ---------- */
function taskFilterFn(u){
  var f=ui.f,area=(u.profile&&u.profile.area||'').toLowerCase().split(/[,;]/).map(function(s){return s.trim();}).filter(Boolean);
  return function(q){
    if(q.status!=='Pending'||q.assignedTo)return false;
    if(f.loc&&q.location.toLowerCase().indexOf(f.loc.toLowerCase())<0)return false;
    if(f.urg&&q.urgency!==f.urg)return false;
    if(f.type&&q.disasterType!==f.type)return false;
    if(f.cat&&q.category!==f.cat)return false;
    if(f.mine&&area.length&&!area.some(function(a){return q.location.toLowerCase().indexOf(a)>-1;}))return false;
    return true;
  };
}
function taskListHtml(u){
  var l=db.requests.filter(taskFilterFn(u)).sort(function(a,b){return SEVRANK[a.urgency]-SEVRANK[b.urgency]||new Date(b.createdAt)-new Date(a.createdAt);});
  if(!l.length)return emptyBox('search',t('noTasks'));
  return l.map(function(q){
    return requestCard(q,'vol').replace(/<\/article>$/,'<div class="actions-row"><button class="btn sm" data-act="vol-accept" data-id="'+q.id+'">'+ic('check')+' '+esc(t('acceptTask'))+'</button></div></article>');
  }).join('');
}

function bars(map,keyLabel){
  var max=Math.max.apply(null,Object.keys(map).map(function(k){return map[k];}).concat([1]));
  return Object.keys(map).map(function(k){
    return '<div class="chart-row"><span>'+esc(keyLabel(k))+'</span><div class="meter"><span style="width:'+Math.round(map[k]/max*100)+'%"></span></div><strong>'+map[k]+'</strong></div>';
  }).join('');
}

/* ---------- render pipeline ---------- */
var lastKey='';
function viewFor(r){
  switch(r.page){
    case 'alerts':return viewAlerts();
    case 'shelters':return viewShelters();
    case 'resources':return viewResources();
    case 'login':return viewLogin();
    case 'register':return viewRegister();
    case 'dashboard':return viewDashboard(r);
    default:return viewHome();
  }
}
function renderHeader(){$('#hdr').innerHTML=headerHtml(route());}
function updateDemoBannerText(){
  var titleEl=$('#db-title');if(titleEl)titleEl.textContent=t('noticeTitle')+':';
  var textEl=$('#db-text');if(textEl)textEl.textContent=t('noticeBody');
  var callEl=$('#db-call');if(callEl)callEl.textContent=t('helpline')+':';
}
function render(){
  var r=route(),key=r.page+'/'+r.sub,y=window.scrollY;
  if(r.page==='dashboard'&&!me()){toast(t('needLogin'),'warn');location.hash='#/login';return;}
  if((r.page==='login'||r.page==='register')&&me()){location.hash='#/dashboard';return;}
  document.documentElement.lang=lang;
  $('#skip').textContent=t('skip');
  document.title=t('brand')+' – '+t('tagline');
  updateDemoBannerText();
  renderHeader();
  $('#app').innerHTML=viewFor(r);
  $('#ftr').innerHTML=footerHtml();
  var same=key===lastKey;
  lastKey=key;
  window.scrollTo(0,same?y:0);
  if(!same){var m=$('#app');m.focus({preventScroll:true});}
}
function go(h){if(location.hash===h)render();else location.hash=h;}

H.demo=function(el){
  var em=$('#l-email'),pw=$('#l-pass');
  if(em&&pw){em.value=el.dataset.email;pw.value=el.dataset.pass;pw.focus();}
};
H['reset-demo']=function(){
  openDlg('<h2 id="dlg-title">'+esc(t('resetDemo'))+'</h2><p>'+esc(t('confirmReset'))+'</p><div class="row"><button class="btn danger" data-act="reset-go">'+esc(t('reset'))+'</button><button class="btn ghost" data-act="dlg-close">'+esc(t('cancel'))+'</button></div>');
};
H['reset-go']=function(){closeDlg();ls.del('nammarescue_session');db=seed();save();toast(t('toast.reset'));go('#/');};
H['dlg-close']=closeDlg;
H.sync=function(){syncOffline(false);};
H['clear-filters']=function(){ui.f={loc:'',urg:'',type:'',cat:'',mine:false};render();};
H.gps=function(el){acquireGPS(el.dataset.target,el);};
H['remove-photo']=function(){
  ui.photo=null;
  var wrap=$('#photo-prev-wrap');if(wrap)wrap.style.display='none';
  var inp=$('#photo-input');if(inp)inp.value='';
};
H['req-edit']=function(el){
  var q=reqById(el.dataset.id);if(!q||q.status!=='Pending')return;
  openDlg('<h2 id="dlg-title">'+esc(t('editRequest'))+'</h2><form data-form="req-edit" data-id="'+q.id+'" novalidate>'+requestFields(q)+'<div class="row" style="margin-top:1rem"><button class="btn" type="submit">'+esc(t('save'))+'</button><button class="btn ghost" type="button" data-act="dlg-close">'+esc(t('close'))+'</button></div></form>');
};
H['req-cancel']=function(el){
  openDlg('<h2 id="dlg-title">'+esc(t('cancelRequest'))+'</h2><p>'+esc(t('confirmCancel'))+'</p><div class="row"><button class="btn danger" data-act="req-cancel-go" data-id="'+el.dataset.id+'">'+esc(t('cancelRequest'))+'</button><button class="btn ghost" data-act="dlg-close">'+esc(t('keep'))+'</button></div>');
};
H['req-cancel-go']=function(el){
  var q=reqById(el.dataset.id),u=me();closeDlg();
  if(q&&q.userId===u.id&&q.status==='Pending'){q.status='Cancelled';logUpdate(q,{type:'status',status:'Cancelled',by:u.name});save();toast(t('toast.cancelled'));render();}
};
H['vol-accept']=function(el){
  var u=me(),q=reqById(el.dataset.id);
  if(!u.profile){toast(t('toast.profileFirst'),'warn');go(dlink('profile'));return;}
  if(!q||q.status!=='Pending'||q.assignedTo)return;
  q.assignedTo=u.id;q.assignedName=u.name;
  setStatus(q,'Acknowledged',u.name);
  notify(q.userId,'n.volunteer',{cat:q.category,name:u.name});
  save();toast(t('toast.accepted'));render();
};
H['vol-progress']=function(el){
  var q=reqById(el.dataset.id),u=me();if(!q||q.assignedTo!==u.id)return;
  openDlg('<h2 id="dlg-title">'+esc(t('updateProgress'))+'</h2><form data-form="progress" data-id="'+q.id+'" novalidate><div class="field"><label for="pg-pct">'+esc(t('progressPct'))+': <output id="pg-out">'+(q.progress||10)+'</output>%</label><input id="pg-pct" name="pct" type="range" min="0" max="90" step="10" value="'+(q.progress||10)+'" data-range="pg-out"></div><div class="field"><label for="pg-note">'+esc(t('progressNote'))+'</label><textarea id="pg-note" name="note"></textarea></div><div class="row"><button class="btn" type="submit">'+esc(t('save'))+'</button><button class="btn ghost" type="button" data-act="dlg-close">'+esc(t('close'))+'</button></div></form>');
};
H['vol-complete']=function(el){
  var q=reqById(el.dataset.id),u=me();if(!q||q.assignedTo!==u.id)return;
  setStatus(q,'Resolved',u.name);save();toast(t('toast.completed'));render();
};
H['rep-verify']=function(el){
  var p=db.reports.filter(function(x){return x.id===el.dataset.id;})[0];if(!p)return;
  p.status='verified';notify(p.userId,'n.verified',{loc:p.location});save();toast(t('toast.verified'));render();
};
H['rep-reject']=function(el){
  var p=db.reports.filter(function(x){return x.id===el.dataset.id;})[0];if(!p)return;
  p.status='rejected';notify(p.userId,'n.rejected',{loc:p.location});save();toast(t('toast.rejected'));render();
};
H['alert-withdraw']=function(el){
  db.alerts=db.alerts.filter(function(a){return a.id!==el.dataset.id;});
  save();toast(t('toast.withdrawn'));render();
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(el&&H[el.dataset.act]){H[el.dataset.act](el,e);return;}
  if(ui.bell&&!e.target.closest('.bell-wrap')){ui.bell=false;renderHeader();}
  if(ui.menu&&e.target.closest('#nav a')){ui.menu=false;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(ui.bell){ui.bell=false;renderHeader();}
    var d=$('#dlg');if(d&&d.open)closeDlg();
  }
});
window.addEventListener('hashchange',function(){ui.menu=false;ui.bell=false;ui.photo=null;render();});

/* ---------- form processing ---------- */
var F={};
function setErr(id,msg){var el=$('#'+id);if(el)el.textContent=msg||'';}
function startSession(u){ls.set('nammarescue_session',u.id);}
F.login=function(f,d){
  var email=String(d.get('email')||'').trim().toLowerCase(),pass=String(d.get('password')||'');
  var u=db.users.filter(function(x){return x.email.toLowerCase()===email&&x.password===pass;})[0];
  if(!u){setErr('auth-err',t('errCreds'));return;}
  startSession(u);toast(t('welcome',{name:u.name}));go('#/dashboard');
};
F.register=function(f,d){
  var name=String(d.get('name')||'').trim(),email=String(d.get('email')||'').trim().toLowerCase(),pass=String(d.get('password')||''),role=d.get('role')==='volunteer'?'volunteer':'user';
  if(!name||!email){setErr('auth-err',t('errMissing'));return;}
  if(pass.length<6){setErr('auth-err',t('errPass'));return;}
  if(db.users.some(function(x){return x.email.toLowerCase()===email;})){setErr('auth-err',t('errExists'));return;}
  var u={id:uid('u_'),name:name,email:email,phone:String(d.get('phone')||''),password:pass,role:role,createdAt:iso()};
  if(role==='volunteer')u.profile=null;
  db.users.push(u);save();startSession(u);toast(t('welcome',{name:u.name}));go(role==='volunteer'?dlink('profile'):'#/dashboard');
};
F.report=function(f,d){
  var u=me(),locStr=String(d.get('location')||'').trim(),descStr=String(d.get('description')||'').trim(),dateStr=d.get('date');
  if(!locStr||!descStr||!dateStr){setErr('form-err',t('errMissing'));return;}
  var p={type:d.get('type'),location:locStr,description:descStr,date:dateStr,severity:d.get('severity'),photo:ui.photo};
  ui.photo=null;
  if(isOffline()){queueOffline('report',p,u);toast(t('toast.reportSaved'),'warn');go(dlink('offline'));}
  else{addReport(p,u);toast(t('toast.reportSent'));go(dlink('myrequests'));}
};
F.request=function(f,d){
  var u=me(),locStr=String(d.get('location')||'').trim(),descStr=String(d.get('description')||'').trim();
  if(!locStr||!descStr){setErr('form-err',t('errMissing'));return;}
  var p={category:d.get('category'),people:Math.max(1,parseInt(d.get('people'),10)||1),urgency:d.get('urgency'),disasterType:d.get('disasterType'),location:locStr,description:descStr};
  if(isOffline()){queueOffline('request',p,u);toast(t('toast.requestSaved'),'warn');go(dlink('offline'));}
  else{addRequest(p,u);toast(t('toast.requestSent'));go(dlink('myrequests'));}
};
F['req-edit']=function(f,d){
  var q=reqById(f.dataset.id),u=me();if(!q||q.userId!==u.id||q.status!=='Pending'){closeDlg();return;}
  q.category=d.get('category');
  q.people=Math.max(1,parseInt(d.get('people'),10)||1);
  q.urgency=d.get('urgency');
  q.disasterType=d.get('disasterType');
  q.location=String(d.get('location')||'').trim()||q.location;
  q.description=String(d.get('description')||'').trim()||q.description;
  q.updatedAt=iso();
  save();closeDlg();toast(t('toast.updated'));render();
};
F.profile=function(f,d){
  var u=me(),skills=d.getAll('skills'),area=String(d.get('area')||'').trim();
  if(!area){setErr('form-err',t('errMissing'));return;}
  u.profile={skills:skills,area:area,availability:d.get('availability')};
  save();toast(t('toast.profileSaved'));go(dlink('tasks'));
};
F.progress=function(f,d){
  var q=reqById(f.dataset.id),u=me();if(!q||q.assignedTo!==u.id)return;
  var pct=parseInt(d.get('pct'),10)||0,note=String(d.get('note')||'').trim();
  if(q.status!=='In Progress'){
    q.status='In Progress';
    logUpdate(q,{type:'status',status:'In Progress',by:u.name});
    notify(q.userId,'n.status',{cat:q.category,status:'In Progress'});
  }
  q.progress=pct;logUpdate(q,{type:'note',note:note,pct:pct,by:u.name});save();closeDlg();toast(t('toast.progress'));render();
};
F.dist=function(f,d){
  var u=me(),qty=Math.max(1,parseInt(d.get('quantity'),10)||1),cat=d.get('category');
  db.distributions.unshift({id:uid('d_'),volId:u.id,volName:u.name,requestId:d.get('requestId')||null,category:cat,quantity:qty,beneficiaries:Math.max(0,parseInt(d.get('beneficiaries'),10)||0),notes:String(d.get('notes')||'').trim(),createdAt:iso()});
  var res=db.resources.filter(function(r){return r.category===cat;})[0];
  if(res)res.stock=Math.max(0,res.stock-qty);
  save();toast(t('toast.distRecorded'));render();
};
F.alert=function(f,d){
  var tEn=String(d.get('titleEn')||'').trim(),bEn=String(d.get('bodyEn')||'').trim(),area=String(d.get('area')||'').trim();
  if(!tEn||!bEn||!area){toast(t('errMissing'),'warn');return;}
  var tTa=String(d.get('titleTa')||'').trim(),bTa=String(d.get('bodyTa')||'').trim();
  db.alerts.unshift({id:uid('a_'),level:d.get('level'),titleEn:tEn,titleTa:tTa||tEn,bodyEn:bEn,bodyTa:bTa||bEn,areaEn:area,areaTa:area,issuedAt:iso()});
  save();toast(t('toast.published'));render();
};
F['shelter-update']=function(f,d){
  var s=db.shelters.filter(function(x){return x.id===f.dataset.id;})[0];if(!s)return;
  s.occupied=Math.max(0,parseInt(d.get('occupied'),10)||0);
  s.status=d.get('status')==='closed'?'closed':'open';
  save();toast(t('toast.updated'));render();
};
F['shelter-add']=function(f,d){
  var name=String(d.get('name')||'').trim(),area=String(d.get('area')||'').trim();
  if(!name||!area){toast(t('errMissing'),'warn');return;}
  db.shelters.push({id:uid('s_'),nameEn:name,nameTa:String(d.get('nameTa')||'').trim()||name,areaEn:area,areaTa:area,capacity:Math.max(1,parseInt(d.get('capacity'),10)||1),occupied:0,facilities:d.getAll('facilities'),contact:String(d.get('contact')||'').trim(),status:'open'});
  save();toast(t('toast.added'));render();
};
F['res-update']=function(f,d){
  var r=db.resources.filter(function(x){return x.id===f.dataset.id;})[0];if(!r)return;
  r.total=Math.max(1,parseInt(d.get('total'),10)||1);
  r.stock=Math.min(r.total,Math.max(0,parseInt(d.get('stock'),10)||0));
  save();toast(t('toast.updated'));render();
};
F['res-add']=function(f,d){
  var name=String(d.get('name')||'').trim(),unit=String(d.get('unit')||'').trim(),lo=String(d.get('location')||'').trim();
  if(!name||!unit||!lo){toast(t('errMissing'),'warn');return;}
  var total=Math.max(1,parseInt(d.get('total'),10)||1);
  db.resources.push({id:uid('r_'),category:d.get('category'),nameEn:name,nameTa:String(d.get('nameTa')||'').trim()||name,unitEn:unit,unitTa:unit,stock:Math.min(total,Math.max(0,parseInt(d.get('stock'),10)||0)),total:total,locationEn:lo,locationTa:lo});
  save();toast(t('toast.added'));render();
};

document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  if(f.checkValidity&&!f.checkValidity()){f.reportValidity();return;}
  var h=F[f.dataset.form];if(h)h(f,new FormData(f));
});

/* ---------- photo compression, simulation toggle, filter & inputs ---------- */
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='photo-input'&&el.files&&el.files[0]){
    var file=el.files[0];
    if(file.size>10*1024*1024){toast('Image file too large (>10MB)','warn');return;}
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        // Compress to max 480px width/height and 0.55 quality to prevent exceeding browser localStorage limit
        var maxDim=480;
        var s=Math.min(1,maxDim/Math.max(img.width,img.height));
        var c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*s));
        c.height=Math.max(1,Math.round(img.height*s));
        var ctx=c.getContext('2d');
        ctx.drawImage(img,0,0,c.width,c.height);
        ui.photo=c.toDataURL('image/jpeg',0.55);
        var pv=$('#photo-prev');
        var wrap=$('#photo-prev-wrap');
        if(pv&&wrap){pv.src=ui.photo;wrap.style.display='block';}
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
    return;
  }
  var ch=el.dataset&&el.dataset.change;
  if(ch==='sim'){
    ui.sim=el.checked;
    toast(ui.sim?t('toast.nowOffline'):t('toast.nowOnline'),ui.sim?'warn':'');
    if(!ui.sim)syncOffline(true);
    render();
    return;
  }
  if(ch==='assign'){
    var q=reqById(el.dataset.id),v=db.users.filter(function(x){return x.id===el.value;})[0];
    if(!q)return;
    if(v){
      q.assignedTo=v.id;q.assignedName=v.name;
      logUpdate(q,{type:'assign',name:v.name});
      notify(v.id,'n.assignedYou',{cat:q.category,loc:q.location});
      if(q.status==='Pending')setStatus(q,'Acknowledged',me().name);
    } else {
      q.assignedTo=null;q.assignedName=null;q.updatedAt=iso();
    }
    save();toast(t('toast.assigned'));render();return;
  }
  if(ch==='req-status'){
    var q2=reqById(el.dataset.id);if(!q2)return;
    setStatus(q2,el.value,me().name);save();toast(t('toast.updated'));render();return;
  }
  if(el.dataset&&el.dataset.filter){
    var k=el.dataset.filter;
    ui.f[k]=el.type==='checkbox'?el.checked:el.value;
    var l=$('#vol-list');if(l)l.innerHTML=taskListHtml(me());
  }
});

document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='shelter-search'){
    ui.shelterQ=el.value;
    var listEl=$('#shelter-list');
    if(listEl)listEl.innerHTML=shelterListHtml(ui.shelterQ);
    return;
  }
  if(el.dataset&&el.dataset.filter==='loc'){
    ui.f.loc=el.value;
    var l=$('#vol-list');if(l)l.innerHTML=taskListHtml(me());
    return;
  }
  if(el.dataset&&el.dataset.range){
    var o=$('#'+el.dataset.range);if(o)o.textContent=el.value;
  }
});

window.addEventListener('online',function(){if(!ui.sim){toast(t('toast.nowOnline'));syncOffline(true);render();}});
window.addEventListener('offline',function(){toast(t('toast.nowOffline'),'warn');render();});
$('#dlg').addEventListener('click',function(e){if(e.target===this)closeDlg();});

render();
})();
</script>
